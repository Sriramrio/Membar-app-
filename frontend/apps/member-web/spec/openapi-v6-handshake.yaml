openapi: 3.1.0
info:
  title: SETHU V6 Backend Handshake
  version: 6.2.0-contract
servers:
  - url: /api
paths:
  /v6/bootstrap:
    get:
      operationId: bootstrap
      responses:
        '200': { description: Bounded authenticated bootstrap snapshot }
  /v6/member/commands:
    post: { operationId: memberCommand, responses: { '200': { description: Command result }, '409': { description: Domain conflict }, '412': { description: Version conflict } } }
  /v6/management/commands:
    post: { operationId: managementCommand, responses: { '200': { description: Command result } } }
  /v6/governance/commands:
    post: { operationId: governanceCommand, responses: { '200': { description: Command result } } }
  /v6/platform-admin/commands:
    post: { operationId: platformAdminCommand, responses: { '200': { description: Command result } } }
  /v6/member/query:
    post: { operationId: memberQuery, responses: { '200': { description: Query result or cursor page } } }
  /v6/management/query:
    post: { operationId: managementQuery, responses: { '200': { description: Query result or cursor page } } }
  /v6/governance/query:
    post: { operationId: governanceQuery, responses: { '200': { description: Query result or cursor page } } }
  /v6/platform-admin/query:
    post: { operationId: platformAdminQuery, responses: { '200': { description: Query result or cursor page } } }
components:
  schemas:
    DomainCommand:
      type: object
      required: [commandId, domain, command, aggregateType, aggregateId, payload, actor]
      properties:
        commandId: { type: string }
        domain: { enum: [member, management, governance, platform-admin] }
        command: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        payload: {}
        actor: { type: object }
        expectedVersion: { type: string }
        reason: { type: string }
    DomainQueryRequest:
      type: object
      required: [queryId, domain]
      properties:
        queryId: { type: string }
        domain: { enum: [member, management, governance, platform-admin] }
        parameters: { type: object, additionalProperties: true }
        search: { type: string }
        filters: { type: array, items: { type: object } }
        sort: { type: array, items: { type: object } }
        pagination: { type: object, properties: { cursor: { type: string }, pageSize: { type: integer, minimum: 1, maximum: 100 } } }
        facets: { type: array, items: { type: object } }
        fields: { type: array, items: { type: string } }
        includes: { type: array, items: { type: string } }
        timezone: { type: string }
        consistencyToken: { type: string }
    ApiError:
      type: object
      required: [type, title, detail, status, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        status: { type: integer }
        correlationId: { type: string }
        retryable: { type: boolean }
        fieldErrors: { type: object, additionalProperties: true }
        currentVersion: { type: string }
        allowedRecovery: { type: array, items: { type: string } }
        code: { type: string }
